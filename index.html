  SUB.password = () => `<div class="card"><div class="field"><label for="apOld">Joriy parol</label><input id="apOld" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="apNew">Yangi parol (kamida 6 belgi)</label><input id="apNew" type="password" autocomplete="new-password"></div>
    <button type="button" class="btn primary" data-act="savePw">Parolni o'zgartirish</button><div class="hint">O'zgartirgach, boshqa qurilmalardagi admin kirishlari yopiladi.</div></div>`;

  // ---------- bottom sheets
  function openSheet(html, after) {
    const sh = $("sheet");
    sh.innerHTML = `<div class="grab"></div>` + html; sh.hidden = false; $("scrim").hidden = false;
    if (after) after(sh);
  }
  function closeSheet() { $("sheet").hidden = true; $("scrim").hidden = true; $("sheet").innerHTML = ""; }
  $("scrim").addEventListener("click", closeSheet);

  // New product: either received into the warehouse (pieces + price of the batch), or "omborsiz" —
  // never received, only sold, with today's purchase price that the admin updates when it changes.
  function productSheet(p) {
    const isNew = !p;
    p = p || { id: "", name: "", uc: "", price: "", active: true, noStock: false, cost: 0 };
    openSheet(`<h3>${isNew ? "Yangi tovar" : p.noStock ? "Omborsiz tovar" : "Tovarni tahrirlash"}</h3>
      <div class="field"><label for="prName">Tovar (paket) nomi</label><input id="prName" value="${esc(p.name)}" placeholder="masalan QR3850 yoki 660web" autocomplete="off"></div>
      ${isNew ? `<label class="toggle" for="prNoStock">Omborsiz tovar <small class="muted">kelmaydi, faqat sotiladi</small><input type="checkbox" id="prNoStock"></label>
      <div class="grid2"><div class="field" id="prDonaF"><label for="prDona">Nechta dona keldi <span class="muted">(ixtiyoriy)</span></label><input id="prDona" inputmode="numeric" placeholder="50"></div>
      <div class="field"><label for="prCost" id="prCostL">1 dona kelish narxi <span class="muted">(ixtiyoriy)</span></label><input id="prCost" inputmode="numeric" placeholder="500 000"></div></div>` : ""}
      ${!isNew && p.noStock ? `<div class="field"><label for="prCost">Bugungi kelish narxi (1 dona), UZS</label><input id="prCost" inputmode="numeric" value="${p.cost || ""}" placeholder="489 000"></div><div class="hint">Yangi narx bundan keyingi sotuvlarga qo'llanadi. Oldingi sotuvlar o'z kunidagi narxda qoladi.</div>` : ""}
      ${isNew ? `<div class="hint" id="prHint"></div>` : `<label class="toggle" for="prActive">Faol (sotuvda chiqadi) <input type="checkbox" id="prActive" ${p.active ? "checked" : ""}></label>${p.noStock ? "" : `<div class="hint">Qoldiq qo'shish uchun ⋯ → Kirim qo'shish.</div>`}`}
      <button type="button" class="btn primary" id="prSave">Saqlash</button><div class="msg" id="prMsg"></div>`, () => {
      const noStock = () => isNew ? $("prNoStock").checked : p.noStock;
      $("prSave").addEventListener("click", async () => {
        const m = $("prMsg"); m.className = "msg"; m.textContent = "Saqlanmoqda…"; $("prSave").disabled = true;
        try {
          await call("saveProduct", { id: p.id, name: $("prName").value, uc: p.uc || 0, price: p.price || 0, active: isNew ? true : $("prActive").checked,
            noStock: noStock(), dona: isNew && !noStock() ? $("prDona").value : 0, cost: $("prCost") ? $("prCost").value : undefined });
          closeSheet(); await load(); toast(isNew ? "Tovar qo'shildi" : "Saqlandi");
        } catch (e) { m.className = "msg err"; m.textContent = e.message; $("prSave").disabled = false; }
      });
      if (isNew) {
        const hint = () => {
          const ns = noStock(), d = Math.floor(toNum($("prDona").value)), c = toNum($("prCost").value);
          $("prDonaF").hidden = ns;
          $("prCostL").innerHTML = ns ? "Bugungi kelish narxi (1 dona)" : `1 dona kelish narxi <span class="muted">(ixtiyoriy)</span>`;
          $("prHint").textContent = ns ? "Omborga kirim qilinmaydi va qoldiq hisoblanmaydi. Kelish narxi o'zgarsa: ⋯ → Kelish narxi yoki nomini o'zgartirish."
            : d > 0 && c > 0 ? `Jami kelish: ${fmt(d * c)} UZS` : d > 0 ? "1 dona kelish narxini ham yozing." : "Donani bo'sh qoldirsangiz, tovar 0 dona bilan qo'shiladi. Keyin ⋯ → Kirim qo'shish.";
        };
        ["prDona", "prCost"].forEach(id => $(id).addEventListener("input", hint)); $("prNoStock").addEventListener("change", hint); hint();
      }
    });
  }
  // New receipt into the warehouse: a separate batch with its own price of 1 piece (FIFO).
  function kirimSheet(pid) {
    const prods = D().products.filter(p => p.active && !p.noStock);
    if (!prods.length) { toast("Avval katalogga omborli tovar qo'shing.", true); return; }
    openSheet(`<h3>Omborga kirim</h3>
      <div class="field"><label for="kPid">Tovar</label><select id="kPid">${prods.map(p => `<option value="${esc(p.id)}" ${p.id === pid ? "selected" : ""}>${esc(p.name)} · qoldiq ${fmt(left(p.id))}</option>`).join("")}</select></div>
      <div class="grid2"><div class="field"><label for="kDona">Nechta dona</label><input id="kDona" inputmode="numeric" placeholder="50"></div>
      <div class="field"><label for="kSum">1 dona kelish narxi, UZS</label><input id="kSum" inputmode="numeric" placeholder="500 000"></div></div>
      <div class="field"><label for="kNote">Kimdan / izoh</label><input id="kNote" autocomplete="off"></div>
      <div class="hint" id="kHint"></div>
      <button type="button" class="btn primary" id="kSave">Kirimni saqlash</button><div class="msg" id="kMsg"></div>`, () => {
      const hint = () => { const d = Math.floor(toNum($("kDona").value)), s = toNum($("kSum").value); $("kHint").textContent = d > 0 && s > 0 ? `Jami: ${fmt(s * d)} UZS` : ""; };
      $("kDona").addEventListener("input", hint); $("kSum").addEventListener("input", hint);
      $("kSave").addEventListener("click", async () => {
        const m = $("kMsg"); m.className = "msg"; m.textContent = "Saqlanmoqda…"; $("kSave").disabled = true;
        const pr = prodById($("kPid").value), d = Math.floor(toNum($("kDona").value));
        try { await call("addKirim", { pid: $("kPid").value, dona: d, sum: toNum($("kSum").value) * d, note: $("kNote").value }); closeSheet(); await load(); toast(`Omborga qo'shildi: ${pr ? pr.name : ""} × ${fmt(d)}`); }
        catch (e) { m.className = "msg err"; m.textContent = e.message; $("kSave").disabled = false; }
      });
    });
  }
  // All receipts of one product, newest first; tap one to fix its price or piece count.
  function kirimListSheet(p) {
    const ks = D().kirim.filter(k => k.pid === p.id).sort((a, b) => b.ts - a.ts);
    if (!ks.length) { toast("Bu tovarga hali kirim qilinmagan. ⋯ → Kirim qo'shish.", true); return; }
    openSheet(`<h3>${esc(p.name)} · kirimlar</h3><div class="sub">Xato kiritilgan kirimni tanlang</div><div>${ks.map(k => `<button type="button" class="act" data-k="${esc(k.id)}">${svg("box")}<span style="flex:1;text-align:left">+${fmt(k.dona)} dona × ${fmt(Math.round(k.sum / k.dona))}<br><small class="muted">${tm(k.ts)}${k.note ? " · " + esc(k.note) : ""} · qoldi ${fmt(k.left || 0)}</small></span>${svg("edit")}</button>`).join("")}</div>`, sh => {
      sh.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) kirimEditSheet(ks.find(k => k.id === b.dataset.k)); });
    });
  }
  // Fix a receipt's piece count or purchase price. Profit of sales already taken from it is recounted.
  function kirimEditSheet(k) {
    openSheet(`<h3>${esc(k.pname || "Kirim")}</h3><div class="sub">${tm(k.ts)}</div>
      <div class="grid2"><div class="field"><label for="keDona">Nechta dona</label><input id="keDona" inputmode="numeric" value="${k.dona}"></div>
      <div class="field"><label for="keUnit">1 dona kelish narxi, UZS</label><input id="keUnit" inputmode="numeric" value="${Math.round(k.sum / k.dona)}"></div></div>
      <div class="field"><label for="keNote">Kimdan / izoh</label><input id="keNote" value="${esc(k.note || "")}" autocomplete="off"></div>
      <div class="hint">Shu partiyadan sotilgan tovarlar foydasi yangi narx bo'yicha qayta hisoblanadi.</div>
      <button type="button" class="btn primary" id="keSave">Saqlash</button><div class="msg" id="keMsg"></div>`, () => {
      $("keSave").addEventListener("click", async () => {
        const m = $("keMsg"); m.className = "msg"; m.textContent = "Saqlanmoqda…"; $("keSave").disabled = true;
        try { await call("updateKirim", { id: k.id, dona: Math.floor(toNum($("keDona").value)), unit: toNum($("keUnit").value), note: $("keNote").value }); closeSheet(); await load(); toast("Kirim o'zgartirildi"); }
        catch (e) { m.className = "msg err"; m.textContent = e.message; $("keSave").disabled = false; }
      });
    });
  }
  // Add one product to the cart: count and the real price of 1 piece (shop price pre-filled).
  function sellSheet(p, editIdx) {
    if (!st.selShop && st.me && st.me.shopId) st.selShop = st.me.shopId;
    const shop = shopById(st.selShop); if (!shop) { toast("Do'konni tanlang.", true); return; }
    const line = editIdx !== undefined ? st.cart[editIdx] : null;
    const base = shopPrice(shop, p), max = p.noStock ? 100000 : left(p.id) - inCart(p.id) + (line ? line.n : 0);
    if (max <= 0) { toast("Bu tovarning hammasi savatda.", true); return; }
    let n = line ? line.n : 1;
    const unit = () => toNum($("sUnit").value);
    const draw = () => {
      $("sN").value = n; $("sTotal").textContent = fmt(unit() * n);
      $("sMinus").disabled = n <= 1; $("sPlus").disabled = n >= max;
      const u = unit(); $("sDiff").textContent = base && u && u !== base ? `Do'kon narxi ${fmt(base)} · farq ${u > base ? "+" : ""}${fmt(u - base)} har donada` : "";
    };
    openSheet(`<h3>${esc(p.name)}</h3><div class="sub">${p.noStock ? "buyurtma bo'yicha" : "omborda " + fmt(left(p.id)) + " dona"}${inCart(p.id) ? " · savatda " + fmt(inCart(p.id)) : ""} · ${esc(shop.name)}</div>
      <div class="grid2"><div class="field"><label for="sN">Nechta dona</label><div class="stepper" style="margin:0"><button type="button" id="sMinus" aria-label="Kamaytirish">−</button><input id="sN" class="num" inputmode="numeric" value="1" style="width:70px;text-align:center;font-weight:800;font-size:20px;border:0;background:none"><button type="button" id="sPlus" aria-label="Ko'paytirish">+</button></div></div>
      <div class="field"><label for="sUnit">1 dona narxi, UZS</label><input id="sUnit" inputmode="numeric" value="${(line ? line.unit : base) || ""}" placeholder="narxni yozing"></div></div>
      <div class="hint" id="sDiff"></div>
      <div class="total"><span>Jami</span><b><span id="sTotal" class="num"></span> UZS</b></div>
      <button type="button" class="btn primary" id="sAdd" style="height:56px;font-size:17px">${line ? "Saqlash" : "Savatga qo'shish"}</button><div class="msg" id="sMsg"></div>`, () => {
      $("sMinus").addEventListener("click", () => { if (n > 1) { n--; draw(); } });
      $("sPlus").addEventListener("click", () => { if (n < max) { n++; draw(); } });
      $("sN").addEventListener("input", () => { n = Math.max(1, Math.min(max, Math.floor(toNum($("sN").value)) || 1)); $("sTotal").textContent = fmt(unit() * n); $("sMinus").disabled = n <= 1; $("sPlus").disabled = n >= max; });
      $("sN").addEventListener("change", draw);
      $("sUnit").addEventListener("input", draw);
      const add = () => {
        if (!(unit() > 0)) { const m = $("sMsg"); m.className = "msg err"; m.textContent = "1 dona narxini yozing."; return false; }
        if (line) { line.n = n; line.unit = unit(); return true; }
        const same = st.cart.find(c => c.pid === p.id && c.unit === unit());
        if (same) same.n += n; else st.cart.push({ pid: p.id, name: p.name, n, unit: unit() });
        return true;
      };
      $("sAdd").addEventListener("click", () => { if (add()) { closeSheet(); st.sellQ = ""; render(); if (!line) toast(`Savatga: ${p.name} × ${n}`); } });
      draw();
    });
  }
  function confirmSheet(title, text, btn, fn) {
    openSheet(`<h3>${title}</h3><div class="sub" style="margin-top:0">${text}</div><div class="btnrow"><button type="button" class="btn" id="cNo">Bekor qilish</button><button type="button" class="btn danger" id="cYes">${btn}</button></div>`, () => {
      $("cNo").addEventListener("click", closeSheet);
      $("cYes").addEventListener("click", async () => { $("cYes").disabled = true; try { await fn(); closeSheet(); } catch (e) { toast(e.message, true); $("cYes").disabled = false; } });
    });
  }

  // ---------- events
  $("navIn").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; st.tab = b.dataset.tab; st.sub = []; ls.set("uc.tab", st.tab); render(); window.scrollTo(0, 0); });
  $("backBtn").addEventListener("click", () => { st.sub.pop(); render(); });
  $("refreshBtn").addEventListener("click", load);
  $("datePill").addEventListener("click", periodSheet);
  $("payBar").addEventListener("click", checkout);
  $("avatar").addEventListener("click", () => { if (isAdmin()) pickShopSheet(); else { st.tab = "menu"; st.sub = []; render(); } });
  $("fab").addEventListener("click", () => { st.tab = "sell"; st.sub = []; ls.set("uc.tab", st.tab); render(); window.scrollTo(0, 0); setTimeout(() => { const i = $("sellQ"); if (i) i.focus(); }, 50); });


  $("screen").addEventListener("click", async e => {
    const per = e.target.closest("[data-period]"); if (per) { st.period = per.dataset.period; render(); await load(); return; }
    const cyc = e.target.closest("[data-cycle]"); if (cyc) { const k = cyc.dataset.cycle, order = k === "topBy" ? ["sum", "dona", "profit"] : ["sum", "n"];
      let i = order.indexOf(st[k] || "sum"); do { i = (i + 1) % order.length; } while (order[i] === "profit" && !isAdmin() && !isPartner()); st[k] = order[i]; render(); return; }
    const rcb = e.target.closest("[data-rc]"); if (rcb) { receiptSheet(rcb.dataset.rc); return; }
    const qb = e.target.closest("[data-q]"); if (qb) { const c = st.cart[+qb.dataset.q], p = prodById(c.pid), mx = p && !p.noStock ? left(p.id) - inCart(p.id) + c.n : 1e5; c.n = Math.max(1, Math.min(mx, c.n + Number(qb.dataset.d))); render(); return; }
    const rm = e.target.closest("[data-rm]"); if (rm) { st.cart.splice(+rm.dataset.rm, 1); render(); return; }
    const ec = e.target.closest("[data-editc]"); if (ec) { const i = +ec.dataset.editc, p = prodById(st.cart[i].pid); if (p) sellSheet(p, i); return; }
    const pay = e.target.closest("#sPays .chip"); if (pay) { st.selPay = pay.dataset.p; ls.set("uc.pay", st.selPay); document.querySelectorAll("#sPays .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.p === st.selPay)); return; }
    const cat = e.target.closest("[data-cat]"); if (cat) { st.catFilter = cat.dataset.cat; render(); return; }
    const sh = e.target.closest("[data-shop]"); if (sh) { st.selShop = sh.dataset.shop; ls.set("uc.shop", st.selShop); render(); return; }
    const pk = e.target.closest("[data-pick]"); if (pk) { enterShop(pk.dataset.pick); return; }
    const sub = e.target.closest("[data-sub]"); if (sub) { st.sub.push({ v: sub.dataset.sub, id: sub.dataset.id }); render(); window.scrollTo(0, 0); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    try {
      if (act === "newProduct") productSheet(null);
      if (act === "prodMenu") {
        const p = prodById(id);
        openSheet(`<h3>${esc(p.name)}</h3><div>
          ${p.noStock ? `<button type="button" class="act" id="aEdit">${svg("edit")} Kelish narxi yoki nomini o'zgartirish</button>` : `<button type="button" class="act" id="aKirim">${svg("box")} Kirim qo'shish</button>
          <button type="button" class="act" id="aLots">${svg("doc")} Kelish narxini to'g'rilash</button>
          <button type="button" class="act" id="aEdit">${svg("edit")} Nomini o'zgartirish</button>`}
          <button type="button" class="act danger" id="aDel">${svg("trash")} O'chirish</button></div>`, () => {
          if ($("aKirim")) $("aKirim").addEventListener("click", () => kirimSheet(p.id));
          $("aEdit").addEventListener("click", () => productSheet(p));
          if ($("aLots")) $("aLots").addEventListener("click", () => kirimListSheet(p));
          $("aDel").addEventListener("click", () => confirmSheet("Tovarni o'chirish", "Sotuv yoki kirim tarixi bo'lsa, tovar o'chirilmaydi: «faol emas» bo'ladi va tarix saqlanadi.", "O'chirish", async () => {
            const r = await call("deleteProduct", { id: p.id }); await load(); toast(r.archived ? "Tovar sotuvdan olindi" : "Tovar o'chirildi");
          }));
        });
      }
      if (act === "sellOpen") { const p = prodById(id); if (p) sellSheet(p); }
      if (act === "pickList") pickListSheet();
      if (act === "clearCart") confirmSheet("Savatni tozalash", "Savatdagi hamma tovarlar olib tashlanadi.", "Tozalash", async () => { st.cart = []; render(); });
      if (act === "txMenu") {
        const s = D().sales.find(x => x.id === id);
        confirmSheet("Sotuvni o'chirish", `${esc(s.pname)}${s.dona > 1 ? " × " + s.dona : ""} · ${fmt(s.price)} UZS · ${tm(s.ts)}. Tovar omborga qaytadi.`, "O'chirish", async () => { await call("deleteSale", { id }); await load(); toast("Sotuv o'chirildi"); });
      }
      if (act === "shiftStart") { await call("shiftStart"); await load(); toast("Ish boshlandi"); }
      if (act === "shiftEnd") confirmSheet("Ishni tugatish", "Bugungi ish vaqtingiz shu daqiqada tugaydi.", "Ishni tugatdim", async () => { await call("shiftEnd"); await load(); toast("Ish tugatildi"); });
      if (act === "logout") { call("logout").catch(() => {}); toLogin(""); }
      if (act === "newShop") { st.sub.push({ v: "shop", id: "new" }); render(); }
      if (act === "copyLink") { const i = $("shLink"); i.select(); try { await navigator.clipboard.writeText(i.value); toast("Havola nusxalandi"); } catch (_) { try { document.execCommand("copy"); toast("Havola nusxalandi"); } catch (__) { toast("Havolani belgilab, nusxa oling"); } } }
      if (act === "pickShop") pickShopSheet();
      if (act === "saveShopPrices") { const sh = shopById(id); await call("saveShop", { id, name: sh.name, prices: readPrices() }); await load(); toast("Narxlar saqlandi"); }
      if (act === "saveShop") {
        const r = await call("saveShop", { id: id === "new" ? "" : id, name: $("shName").value, prices: readPrices() });
        st.sub[st.sub.length - 1] = { v: "shop", id: r.id }; await load(); toast("Do'kon saqlandi");
      }
      if (act === "archShop") confirmSheet("Do'konni yopish", "Yopilgan do'kon sotuvda chiqmaydi va uning havolasi ishlamay qoladi. Tarix saqlanadi.", "Yopish", async () => { await call("archiveShop", { id }); st.sub.pop(); await load(); toast("Do'kon yopildi"); });
      if (act === "newPerson") { st.sub.push({ v: "person", id: "new" }); render(); }
      if (act === "genPass") { $("pPass").value = genPass(); }
      if (act === "savePerson") {
        const pw = $("pPass").value, login = $("pLogin").value.trim().toLowerCase();
        const r = await call("saveStaff", { id: id === "new" ? "" : id, name: $("pName").value, phone: $("pPhone").value, shopId: $("pShop").value, login, password: pw, active: $("pActive").checked, partner: $("pPartner").checked });
        st.sub[st.sub.length - 1] = { v: "person", id: r.id }; await load();
        const m = $("pMsg"); if (m) { m.className = "msg ok"; m.textContent = pw ? `Saqlandi. Hodimga yuboring: login ${login}, parol ${pw}` : "Saqlandi."; }
      }
      if (act === "delPerson") confirmSheet("Hodimni o'chirish", "Hodim tizimga kira olmaydi. Uning sotuvlari tarixda qoladi.", "O'chirish", async () => { await call("deleteStaff", { id }); st.sub.pop(); await load(); toast("Hodim o'chirildi"); });
      if (act === "kirimOpen") kirimSheet("");
      if (act === "kirimMenu") {
        const k = D().kirim.find(x => x.id === id);
        openSheet(`<h3>Kirim</h3><div>${k && k.pid ? `<button type="button" class="act" id="kEditB">${svg("edit")} Narx yoki donani o'zgartirish</button>` : ""}
          <button type="button" class="act danger" id="kDelB">${svg("trash")} O'chirish</button></div>`, () => {
          if ($("kEditB")) $("kEditB").addEventListener("click", () => kirimEditSheet(k));
          $("kDelB").addEventListener("click", () => confirmSheet("Kirimni o'chirish", "Bu kirim ombordan ayiriladi.", "O'chirish", async () => { await call("deleteKirim", { id }); await load(); toast("Kirim o'chirildi"); }));
        });
      }
      if (act === "saveCfg") { await call("saveConfig", { payments: $("cPays").value.split(/[,;]+/).map(s => s.trim()), lowStock: $("cLow").value }); await load(); toast("Saqlandi"); }
      if (act === "savePw") {
        const r = await call("adminPassword", { old: $("apOld").value, password: $("apNew").value });
        saveToken(r.token); $("apOld").value = ""; $("apNew").value = ""; toast("Parol o'zgardi");
      }
    } catch (err) {
      const m = $("pMsg");
      if (act === "savePerson" && m) { m.className = "msg err"; m.textContent = err.message; } else toast(err.message, true);
    }
  });

    } catch (err) { m.className = "msg err"; m.textContent = err.message; } finally { $("loginBtn").disabled = false; }
  });

  // Refresh every minute while visible and idle (never while a sheet or a form is open).
  setInterval(() => {
    if (st.view !== "app" || document.visibilityState !== "visible" || st.pending > 0 || st.saving || !$("sheet").hidden) return;
    if (st.tab === "menu" && st.sub.length) return;
    const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "SELECT")) return;
    load();
  }, 60000);

  // A shop link added to the home screen becomes its own app: own name, and it always opens this shop's link.
  function shopManifest(name) {
    if (!LINK_D) return;
    const here = location.origin + location.pathname, start = here + "?d=" + encodeURIComponent(LINK_D), base = new URL(".", here).href;
    const m = { name: "UC · " + name, short_name: name.slice(0, 12), id: start, start_url: start, scope: base, display: "standalone",
      background_color: "#f1f2f4", theme_color: "#ffffff", lang: "uz",
      icons: [{ src: base + "icon-192.png", sizes: "192x192", type: "image/png" }, { src: base + "icon-512.png", sizes: "512x512", type: "image/png" }, { src: base + "icon-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }] };
    const l = document.querySelector('link[rel="manifest"]');
    if (l) l.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(m));
    const t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (t) t.content = name;
    document.title = name + " · UC Savdo";
  }

  // ---------- boot
  (async () => {
    const u = new URL(location.href), q = { d: u.searchParams.get("d") || "", k: u.searchParams.get("k") || "" };
    linkShop = q.d;
    if (!token && q.k) token = q.k;
    if (token) ls.set("uc.token", token);
    setAddress();
    try {
      if (token) {
        st.view = "app"; await load();
        if (st.view === "app" && st.data) { if (LINK_D) call("boot", { shop: LINK_D }).then(b => { if (b.shopName) shopManifest(b.shopName); }).catch(() => {}); return; }
      }
      const b = await call("boot", { shop: linkShop });
      linkShopName = b.shopName || "";
      if (linkShopName) shopManifest(linkShopName);
      if (linkShop && !linkShopName) $("loginHint").textContent = "Bu do'kon havolasi eskirgan yoki do'kon yopilgan. Admindan yangi havola so'rang.";
      if (linkShopName) { $("loginTitle").textContent = linkShopName; $("loginHint").textContent = "Do'kon hodimi sifatida kiring. Login va parolni admin beradi."; }
      st.view = b.needSetup ? "setup" : "login"; render();
    } catch (err) { st.view = "login"; render(); $("loginMsg").className = "msg err"; $("loginMsg").textContent = err.message; }
  })();
})();
</script>
</body>
</html>
